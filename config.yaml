source_priority:
  - statsbomb
  - understat
  - fbref

statsbomb:
  mode: open  # "open" or "paid"

understat:
  enabled: true
  delay_seconds: 3

fbref:
  enabled: true
  delay_seconds: 6

transfermarkt:
  enabled: true
  fallback_csv: data/reference/transfermarkt_values.csv
  delay_seconds: 5

leagues:
  - ENG-Premier League
  - ESP-La Liga
  - GER-Bundesliga
  - ITA-Serie A
  - FRA-Ligue 1

seasons:
  - "2024-25"
  - "2023-24"

min_minutes: 900

position_mapping:
  GK: [Goalkeeper]
  CB: [Center Back, Left Center Back, Right Center Back]
  FB: [Left Back, Right Back, Left Wing Back, Right Wing Back]
  CM: [Center Midfield, Left Center Midfield, Right Center Midfield,
       Center Defensive Midfield, Center Attacking Midfield]
  WG: [Left Wing, Right Wing, Left Midfield, Right Midfield]
  ST: [Center Forward, Striker, Secondary Striker]

similarity_weights:
  CM: { pressing_intensity: 1.5, progressive_action: 1.5 }
  ST: { goal_threat: 2.0 }
  FB: { progressive_action: 1.5, defensive_contrib: 1.3 }
  WG: { chance_creation: 1.5, goal_threat: 1.2 }
  CB: { defensive_contrib: 2.0, aerial_dominance: 1.5 }
  GK: {}

cache:
  database: data/cache.sqlite
  default_ttl_hours: 24

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "https://your-app.vercel.app"   # replace with your real Vercel URL
    - "https://football-scout-production.up.railway.app"
